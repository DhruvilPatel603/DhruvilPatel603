<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 212" width="100%" role="img" aria-label="Coder DNA Easter Egg">
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', ui-monospace, Menlo, Consolas, monospace; }
    .pulse { animation: p 2.4s ease-in-out infinite; }
    @keyframes p { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
  </style>
  <rect x="2" y="2" width="436" height="208" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
  <text class="mono" x="20" y="30" font-size="11" fill="#f43f8e" letter-spacing="1.4">EASTER_EGG // LORE_SIGIL.asc</text>

  <!-- ASCII Dragon / Terminal Crest -->
  <g class="mono" font-size="11.5" fill="#00f0ff" xml:space="preserve">
    <text x="20" y="58">      /\  /\      <tspan fill="#94a3b8">// DUAL-CLASS BUILDER</tspan></text>
    <text x="20" y="75">     (  oo  )     <tspan fill="#e2e8f0">day  : APIs, Android, Chrome</tspan></text>
    <text x="20" y="92">    ==\ == /==    <tspan fill="#fbbf24">night: High-Fantasy Realms</tspan></text>
    <text x="20" y="109">      / || \      <tspan fill="#c4b5fd">fuel : Clean UI + Caffeine</tspan></text>
  </g>

  <rect x="20" y="128" width="400" height="62" rx="8" fill="#050811" stroke="#1e293b"/>
  <text class="mono" x="34" y="152" font-size="11.5" fill="#8b5cf6">$ sudo summon --realm="high-fantasy"</text>
  <text class="mono pulse" x="34" y="174" font-size="11.5" fill="#10b981">[SUCCESS] World-seed compiled. 0 bugs in lore.</text>
</svg>
