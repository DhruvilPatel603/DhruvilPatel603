  <rect x="24" y="138" width="68" height="24" rx="6" fill="#0f172a" stroke="#f43f8e" stroke-opacity="0.45"/><text class="mono" x="57.8" y="154" text-anchor="middle" font-size="11" fill="#cbd5e1">Python</text><rect x="99" y="138" width="90" height="24" rx="6" fill="#0f172a" stroke="#f43f8e" stroke-opacity="0.45"/><text class="mono" x="144.2" y="154" text-anchor="middle" font-size="11" fill="#cbd5e1">LangChain</text><rect x="197" y="138" width="83" height="24" rx="6" fill="#0f172a" stroke="#f43f8e" stroke-opacity="0.45"/><text class="mono" x="238.4" y="154" text-anchor="middle" font-size="11" fill="#cbd5e1">Pinecone</text><rect x="287" y="138" width="62" height="24" rx="6" fill="#0f172a" stroke="#f43f8e" stroke-opacity="0.45"/><text class="mono" x="318.0" y="154" text-anchor="middle" font-size="11" fill="#cbd5e1">Flask</text>

