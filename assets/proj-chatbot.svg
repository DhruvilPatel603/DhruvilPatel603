  <text class="sans" x="74" y="57" font-size="19" font-weight="800" fill="#f8fafc">RAG AI Chatbot</text>

  <rect x="404" y="24" width="132" height="24" rx="12" fill="#0f172a" stroke="#f43f8e" stroke-opacity="0.55"/>
