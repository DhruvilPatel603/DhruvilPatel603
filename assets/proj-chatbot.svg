<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 215" width="100%" role="img" aria-label="RAG AI Chatbot">
  <defs>
    <linearGradient id="cg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0d1426"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  </style>
  <rect x="2" y="2" width="556" height="211" rx="14" fill="url(#cg)" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Accent top bar -->
  <rect x="24" y="2" width="140" height="3.5" rx="1.5" fill="#f43f8e"/>
  <!-- Corner tick -->
  <path d="M540 20 L540 12 L532 12" fill="none" stroke="#f43f8e" stroke-width="1.8"/>

  <!-- Top metadata -->
  <rect x="24" y="22" width="38" height="38" rx="9" fill="#0f172a" stroke="#f43f8e" stroke-opacity="0.5"/>
  <text class="mono" x="43" y="47" text-anchor="middle" font-size="18" fill="#f43f8e">❖</text>

