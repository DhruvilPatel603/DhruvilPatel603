<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 132" width="100%" role="img" aria-label="Pull Request Telemetry Overview">
  <defs>
    <linearGradient id="prBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0c1324"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .pulse { animation: prPulse 2.4s ease-in-out infinite; }
    @keyframes prPulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
  </style>

  <rect x="2" y="2" width="1196" height="128" rx="14" fill="url(#prBg)" stroke="#1e293b" stroke-width="1.5"/>

  <circle class="pulse" cx="34" cy="34" r="4.5" fill="#10b981"/>
  <text class="mono" x="48" y="38" font-size="12" fill="#94a3b8" letter-spacing="1.2">UPSTREAM_PR_DISTRIBUTION // <tspan fill="#e2e8f0">14 PUBLIC PULL REQUESTS</tspan></text>

  <!-- Summary Metric Pills on Right -->
  <g transform="translate(650, 18)">
    <rect x="0" y="0" width="124" height="28" rx="7" fill="#0f172a" stroke="#10b981" stroke-opacity="0.55"/>
    <text class="mono" x="62" y="18" text-anchor="middle" font-size="11.5" font-weight="700" fill="#10b981">10 MERGED</text>

    <rect x="134" y="0" width="110" height="28" rx="7" fill="#0f172a" stroke="#00f0ff" stroke-opacity="0.55"/>
    <text class="mono" x="189" y="18" text-anchor="middle" font-size="11.5" font-weight="700" fill="#00f0ff">3 OPEN</text>

    <rect x="254" y="0" width="118" height="28" rx="7" fill="#0f172a" stroke="#64748b" stroke-opacity="0.55"/>
    <text class="mono" x="313" y="18" text-anchor="middle" font-size="11.5" font-weight="700" fill="#94a3b8">1 CLOSED</text>

    <rect x="382" y="0" width="136" height="28" rx="7" fill="#0f172a" stroke="#8b5cf6" stroke-opacity="0.55"/>
    <text class="mono" x="450" y="18" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c4b5fd">3 UPSTREAM</text>
  </g>

  <!-- Segmented PR Distribution Bar -->
  <rect x="32" y="64" width="1136" height="14" rx="7" fill="#050811" stroke="#1e293b"/>
  <rect x="32" y="64" width="892" height="14" rx="7" fill="#00f0ff"/>
  <rect x="927" y="64" width="159" height="14" rx="4" fill="#8b5cf6"/>
  <rect x="1089" y="64" width="79" height="14" rx="7" fill="#f43f8e"/>

  <!-- Legend Row -->
  <circle cx="40" cy="102" r="4.5" fill="#00f0ff"/>
  <text class="mono" x="52" y="106" font-size="12" fill="#e2e8f0">anmolkapil/plexo <tspan fill="#00f0ff">(11 PRs · 78.6%)</tspan></text>

  <circle cx="395" cy="102" r="4.5" fill="#8b5cf6"/>
  <text class="mono" x="407" y="106" font-size="12" fill="#e2e8f0">The-PR-Agent/pr-agent <tspan fill="#c4b5fd">(2 PRs · 14.3%)</tspan></text>

  <circle cx="775" cy="102" r="4.5" fill="#f43f8e"/>
  <text class="mono" x="787" y="106" font-size="12" fill="#e2e8f0">21CE085/GitHub-Session <tspan fill="#f9a8d4">(1 PR · 7.1%)</tspan></text>
</svg>
