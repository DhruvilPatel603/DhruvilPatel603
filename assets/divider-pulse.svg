<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 28" width="100%" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00f0ff" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#f43f8e" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .pkt1 { animation: sweepR 3.2s linear infinite; }
    .pkt2 { animation: sweepL 3.8s linear infinite; }
    @keyframes sweepR { 0% { transform: translateX(0px); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(520px); opacity: 0; } }
    @keyframes sweepL { 0% { transform: translateX(0px); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(-520px); opacity: 0; } }
  </style>
  <line x1="40" y1="14" x2="1160" y2="14" stroke="url(#divGrad)" stroke-width="1.5"/>
  <!-- Center Cyber Diamond -->
  <polygon points="600,4 610,14 600,24 590,14" fill="#090d16" stroke="#00f0ff" stroke-width="1.5"/>
  <circle cx="600" cy="14" r="3" fill="#f43f8e"/>
  <!-- Animated Data Packets -->
  <rect class="pkt1" x="60" y="12.5" width="22" height="3" rx="1.5" fill="#00f0ff"/>
  <rect class="pkt2" x="1118" y="12.5" width="22" height="3" rx="1.5" fill="#f43f8e"/>
</svg>
