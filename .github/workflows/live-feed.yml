name: Update Live Activity & PR Feed

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/update_live_feed.py"
      - ".github/workflows/live-feed.yml"

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate Live Activity & PR SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: python3 scripts/update_live_feed.py

      - name: Commit and push updated SVGs if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/live-feed.svg assets/pr-overview.svg assets/pr-plexo.svg assets/pr-pragent.svg assets/pr-session.svg assets/header-oss.svg assets/proj-attendance.svg assets/proj-network-meter.svg assets/cws-traction.svg assets/pacman-cyber.svg
          if git diff --cached --quiet; then
            echo "No SVG changes detected."
          else
            git commit -m "chore: update live activity and PR telemetry SVGs [skip ci]"
            git push
          fi
